name: yayin
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  yayin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx openpyxl pyyaml
      - run: python _ortak/dogrula.py --paketle
      - name: claude.ai yukleme paketleriyle surum yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file DEGISIKLIKLER.md
